# Castor layers this over compose.yaml and compose.override.yaml.
services:
  php:
    environment:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_SECRET: browser-synthetic-only
      DATABASE_URL: 'sqlite:////app/var/browser/application.db'
    volumes: !override
      - .:/app:ro
      - ./var/browser-live:/app/var
      - '${CHATGPT_KEY_PATH}:/run/secrets/chatgpt.key:ro'
  broker:
    environment:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_SECRET: browser-synthetic-only
    volumes: !override
      - .:/app:ro
      - ./var/browser-live:/app/var
  worker:
    environment:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_SECRET: browser-synthetic-only
    volumes: !override
      - .:/app:ro
      - ./var/browser-live:/app/var
