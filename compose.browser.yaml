# Castor layers this over compose.yaml and compose.override.yaml.
services:
  php:
    environment:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_SECRET: browser-synthetic-only
      DATABASE_URL: 'sqlite:////app/var/browser/application.db'
      CHAT_MODEL: '${CHAT_MODEL:-gpt-6-luna}'
      CHAT_REASONING_EFFORT: '${CHAT_REASONING_EFFORT:-low}'
      PROVIDER_CASSETTE_RECORD: '${PROVIDER_CASSETTE_RECORD:-0}'
    volumes: !override
      - .:/app:ro
      - ./var/browser-live:/app/var
      - chart_output:/chart-output
  broker:
    environment:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_SECRET: browser-synthetic-only
    volumes: !override
      - .:/app:ro
      - ./var/browser-live:/app/var
  worker:
    command: ['php', 'bin/console', 'messenger:consume', 'statement_import', 'chat', '--concurrency=4', '--keepalive=5', '--memory-limit=256M', '--time-limit=3600', '--no-interaction']
    environment:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_SECRET: browser-synthetic-only
      CHAT_MODEL: '${CHAT_MODEL:-gpt-6-luna}'
      CHAT_REASONING_EFFORT: '${CHAT_REASONING_EFFORT:-low}'
      PROVIDER_CASSETTE_RECORD: '${PROVIDER_CASSETTE_RECORD:-0}'
    volumes: !override
      - .:/app:ro
      - ./var/browser-live:/app/var
      - chart_output:/chart-output
