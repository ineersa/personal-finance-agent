# Castor supplies checkout identity and the shared proxy network.
name: "${FINANCE_PROJECT:?Run vendor/bin/castor dev:stack:up}"

services:
  php:
    image: "pfa-${FINANCE_CHECKOUT_ID:?Run vendor/bin/castor dev:stack:up}-php:dev"
    build:
      target: frankenphp_dev
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
    volumes: !override
      - ./:/app
    ports: !reset []
    networks:
      default: {}
      development:
        aliases:
          - "${FINANCE_PROJECT}"

networks:
  development:
    external: true
    name: "${FINANCE_NETWORK:?Run vendor/bin/castor dev:stack:up}"
