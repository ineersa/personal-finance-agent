services:
  php:
    restart: unless-stopped
    env_file:
      - path: .env.prod.local
        required: true
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data/app.db"
    volumes:
      - app_data:/app/var/data

volumes:
  app_data:
