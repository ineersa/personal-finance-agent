# Isolated production-image rebuild proof. Castor supplies checkout identity.
services:
  php:
    image: 'pfa-${FINANCE_CHECKOUT_ID:?Run vendor/bin/castor production:probe up}-php:production-probe'
    restart: 'no'
    env_file: !reset []
    environment:
      APP_SECRET: production-probe-synthetic-only
    volumes: !override
      - ./var/production-probe/data:/app/var/data
    ports: !reset []
    networks:
      default: {}
      development:
        aliases:
          - '${FINANCE_PROJECT}'
  fixtures:
    profiles: [seed]
    image: 'pfa-${FINANCE_CHECKOUT_ID}-tooling:dev'
    user: '${LOCAL_UID}:${LOCAL_GID}'
    environment:
      APP_ENV: dev
      APP_DEBUG: '0'
      APP_SECRET: production-probe-synthetic-only
      DATABASE_URL: 'sqlite:////app/var/data/app.db'
    volumes:
      - .:/app:ro
      - ./var/production-probe:/app/var
      - ./var/production-probe/data/statements:/app/var/statements

networks:
  development:
    external: true
    name: '${FINANCE_NETWORK}'
