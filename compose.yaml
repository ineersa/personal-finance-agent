name: personal-finance-agent

services:
  charts:
    build:
      context: docker/charts
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    volumes:
      - chart_output:/chart-output
    logging:
      driver: none
    # Internal-only MCP; no host ports, Docker socket, database or private files.

  php:
    image: "${COMPOSE_PROJECT_NAME:-personal-finance-agent}-php:prod"
    build:
      context: .
      target: frankenphp_prod
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer/cache
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    volumes:
      - chart_output:/chart-output
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure:v1.1.6
    profiles: [live-updates]
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_JWT_SECRET:-}'
      MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_JWT_SECRET:-}'
      MERCURE_TRUSTED_ISSUERS: 'https://finance.localhost'
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
  chart_output:
###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
