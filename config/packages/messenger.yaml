framework:
    messenger:
        transports:
            chat:
                dsn: 'sqlite-queue://chat'
                options:
                    endpoint: '%kernel.project_dir%/var/queue/broker.sock'
                    timeout: 10
                serializer: messenger.transport.native_php_serializer
                retry_strategy:
                    max_retries: 0
            statement_import:
                dsn: 'sqlite-queue://statement-imports'
                options:
                    endpoint: '%kernel.project_dir%/var/queue/broker.sock'
                    timeout: 10
                serializer: messenger.transport.native_php_serializer
                retry_strategy:
                    max_retries: 0
        routing:
            App\Message\GenerateChat: chat
            App\Message\ProcessStatementMessage: statement_import

sqlite_queue:
    redeliver_timeout: 90
