security:
    password_hashers:
        App\Entity\User:
            algorithm: auto
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
                always_use_default_target_path: true
            login_throttling: ~
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/home(/|$), roles: IS_AUTHENTICATED_FULLY }
