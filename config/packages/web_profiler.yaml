# yaml-language-server: $schema=../schema.json
when@dev:
    web_profiler:
        toolbar: true

    framework:
        profiler:
            excluded_paths:
                - '^/\.well-known/'
                - '^/favicon\.ico$'
                - '^/auth/callback$'
                - '^/home/chatgpt/'
                - '^/home/chat(/|$)'

when@test:
    framework:
        profiler:
            collect: false
