# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(FINANCE_DATABASE_URL): 'sqlite:///%kernel.project_dir%/var/tenant-schema.db'
    env(JEV_API_KEY): ''
    env(JEV_BASE_URL): 'https://api.typesafe.ai'
    env(JEV_MODEL): 'jev-1.14.0'
    env(LOCAL_DEMO_RESET_ENABLED): '0'
    env(CHATGPT_CALLBACK_PORT): !php/const Symfony\AI\Platform\Bridge\OpenAIChatGPT\Auth\OAuthConfig::DEFAULT_PORT
    env(CHATGPT_FINANCE_URL): ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Finance/Entity/'
            - '../src/Finance/Migrations/'
            - '../src/DataFixtures/'
            - '../src/Doctrine/ExactDecimalType.php'
            - '../src/Doctrine/SqliteImmediateTransactionConnection.php'
            - '../src/Doctrine/SqliteImmediateTransactionDriver.php'

    # Native and untraced: OAuth credentials must not enter the HTTP profiler.
    app.chatgpt.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        autoconfigure: false
        arguments:
            $defaultOptions: { timeout: 15, max_duration: 30 }

    Symfony\AI\Platform\Bridge\OpenAIChatGPT\Auth\OAuthConfig:
        arguments:
            $appName: 'Personal finance assistant'
            $port: '%env(int:CHATGPT_CALLBACK_PORT)%'

    Symfony\AI\Platform\Bridge\OpenAIChatGPT\Auth\IdTokenVerifier:
        arguments:
            $httpClient: '@app.chatgpt.http_client'

    App\Doctrine\SqliteImmediateTransactionMiddleware:
        autoconfigure: false
        tags:
            # Wrap the native driver before connection-caching/test middleware.
            - { name: doctrine.middleware, connection: default, priority: 1000 }
            - { name: doctrine.middleware, connection: finance, priority: 1000 }

    doctrine.orm.finance_entity_manager:
        class: Doctrine\ORM\EntityManager
        factory: ['@App\Finance\TenantManagers', current]
        arguments: []
        lazy: true
        public: true

    App\Repository\SourceRepository:
        arguments: { $entityManager: '@doctrine.orm.finance_entity_manager' }
    App\Repository\StatementRepository:
        arguments: { $entityManager: '@doctrine.orm.finance_entity_manager' }
    App\Repository\TransactionRepository:
        arguments: { $entityManager: '@doctrine.orm.finance_entity_manager' }
    App\Repository\CategoryRepository:
        arguments: { $entityManager: '@doctrine.orm.finance_entity_manager' }
    App\Repository\CurrencyRateRepository:
        arguments: { $entityManager: '@doctrine.orm.finance_entity_manager' }
    App\Import\StatementUpload:
        arguments: { $entityManager: '@doctrine.orm.finance_entity_manager' }
    App\Controller\StatementImportController:
        bind: { $entityManager: '@doctrine.orm.finance_entity_manager' }

    # Native client without framework tracing: statement payloads must not enter profiler collectors.
    app.jev.http_client:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        autoconfigure: false
        arguments:
            $defaultOptions: { timeout: 30, max_duration: 60 }

    app.jev.model_catalog:
        class: Symfony\AI\Platform\Bridge\TypeSafe\ModelCatalog
        arguments:
            $additionalModels:
                '%env(JEV_MODEL)%':
                    class: Symfony\AI\Platform\Bridge\TypeSafe\Jev
                    capabilities: []

    app.jev.platform:
        class: Symfony\AI\Platform\Platform
        factory: ['Symfony\AI\Platform\Bridge\TypeSafe\Factory', 'createPlatform']
        arguments:
            $apiKey: '%env(JEV_API_KEY)%'
            $httpClient: '@app.jev.http_client'
            $modelCatalog: '@app.jev.model_catalog'
            $baseUrl: '%env(JEV_BASE_URL)%'

when@dev: &fixture_services
    services:
        App\Demo\DemoReset:
            autowire: true
            arguments:
                $loader: '@hautelook_alice.loader'
        App\DataFixtures\:
            resource: '../src/DataFixtures/'
            autowire: true
            autoconfigure: true
        App\DataFixtures\TenantFixtureLoader:
            autowire: true
            autoconfigure: true
            decorates: hautelook_alice.loader
            arguments:
                $inner: '@App\DataFixtures\TenantFixtureLoader.inner'

when@test: *fixture_services
