parameters:
    env(PROVIDER_CASSETTE_RECORD): '0'

services:
    app.providers.chat:
        class: App\Tests\Support\ProviderCassetteHttpClient
        arguments:
            $captureDirectory: '%kernel.project_dir%/var/private/provider-cassettes/chat'
            $replayDirectory: '%kernel.project_dir%/tests/Fixtures/providers/chat'
            $record: '%env(bool:PROVIDER_CASSETTE_RECORD)%'
            $live: "@=env('bool:PROVIDER_CASSETTE_RECORD') ? service('app.chatgpt.http_client') : null"
        tags: [{ name: kernel.reset, method: reset }]

    app.providers.jev:
        class: App\Tests\Support\ProviderCassetteHttpClient
        arguments:
            $captureDirectory: '%kernel.project_dir%/var/private/provider-cassettes/jev'
            $replayDirectory: '%kernel.project_dir%/tests/Fixtures/providers/jev'
            $record: '%env(bool:PROVIDER_CASSETTE_RECORD)%'
            $live: "@=env('bool:PROVIDER_CASSETTE_RECORD') ? service('app.jev.http_client') : null"
        tags: [{ name: kernel.reset, method: reset }]

    app.providers.ecb:
        class: App\Tests\Support\ProviderCassetteHttpClient
        arguments:
            $captureDirectory: '%kernel.project_dir%/var/private/provider-cassettes/ecb'
            $replayDirectory: '%kernel.project_dir%/tests/Fixtures/providers/ecb'
            $record: '%env(bool:PROVIDER_CASSETTE_RECORD)%'
            $live: "@=env('bool:PROVIDER_CASSETTE_RECORD') ? service('app.providers.ecb_live') : null"
        tags: [{ name: kernel.reset, method: reset }]

    app.providers.ecb_live:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']

    # Deliberately absent and never recorded: even unexpected OAuth refresh fails offline.
    app.providers.oauth_replay:
        class: Symfony\AI\Platform\Test\Replay\CassetteHttpClient
        arguments:
            $cassette: '@app.providers.oauth_absent_cassette'
            $record: false

    app.providers.oauth_absent_cassette:
        class: Symfony\AI\Platform\Test\Replay\HttpCassette
        arguments:
            $path: '%kernel.project_dir%/tests/Fixtures/providers/oauth-unavailable.json'

    App\ChatGpt\OAuthFactory:
        autowire: true
        autoconfigure: true
        arguments:
            $directory: "@=parameter('kernel.project_dir') ~ (env('bool:PROVIDER_CASSETTE_RECORD') ? '/var/private/chatgpt-auth' : '/var/private/chatgpt-replay-auth')"
            $http: "@=env('bool:PROVIDER_CASSETTE_RECORD') ? service('app.chatgpt.http_client') : service('app.providers.oauth_replay')"

    Symfony\AI\Platform\Bridge\OpenAIChatGPT\Auth\IdTokenVerifier:
        arguments:
            $httpClient: "@=env('bool:PROVIDER_CASSETTE_RECORD') ? service('app.chatgpt.http_client') : service('app.providers.oauth_replay')"

    App\Chat\AgentFactory:
        autowire: true
        autoconfigure: true
        arguments:
            $http: '@app.providers.chat'

    app.jev.platform:
        class: Symfony\AI\Platform\Platform
        factory: ['Symfony\AI\Platform\Bridge\TypeSafe\Factory', 'createPlatform']
        arguments:
            $apiKey: "@=env('bool:PROVIDER_CASSETTE_RECORD') ? env('JEV_API_KEY') : 'synthetic-replay-only'"
            $httpClient: '@app.providers.jev'
            $modelCatalog: '@app.jev.model_catalog'
            $baseUrl: '%env(JEV_BASE_URL)%'

    App\Finance\EcbRateRefresher:
        autowire: true
        autoconfigure: true
        arguments:
            $client: '@app.providers.ecb'
